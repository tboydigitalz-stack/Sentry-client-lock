<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --gunmetal-900:#14181c; --gunmetal-800:#1c2229; --gunmetal-700:#262e36;
    --steel-300:#9caab6; --paper:#eef1f3; --paper-dim:#c7cfd6; --hazard:#f6b60b; --ok-green:#3fae6a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--gunmetal-900); color:var(--paper); font-family:'Inter',sans-serif; padding:24px;
  }
  .card{max-width:520px; text-align:center;}
  .check{
    width:64px; height:64px; border-radius:50%; background:var(--ok-green); color:#0c1a12;
    display:flex; align-items:center; justify-content:center; font-size:30px; margin:0 auto 20px; font-weight:700;
  }
  h1{font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:28px; margin:0 0 12px;}
  p{color:var(--paper-dim); line-height:1.6; margin:0 0 10px;}
  .ref{
    font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--hazard);
    background:var(--gunmetal-800); border:1px solid var(--gunmetal-700); border-radius:6px;
    padding:10px 14px; display:inline-block; margin:18px 0;
  }
  a.btn{
    display:inline-block; margin-top:14px; background:var(--hazard); color:#1a1400; text-decoration:none;
    font-weight:700; padding:14px 24px; border-radius:6px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Order Received</h1>
    <p>Thanks — your SentryLock order has been logged. Expect a confirmation call within the next few hours to verify your delivery details.</p>
    <div class="ref">Ref: SL-<span id="ref"></span></div>
    <p>Nothing is charged now. You pay only when the delivery agent hands it over and you've checked it.</p>
    <a class="btn" href="index.html">Back to homepage</a>
  </div>
  <script>
    document.getElementById('ref').textContent = Date.now().toString().slice(-6);
  </script>
</body>
</html>
